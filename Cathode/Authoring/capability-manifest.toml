# Cathode capability manifest — THE SINGLE SOURCE OF TRUTH
#
# 001 SKELETON: structure only. The real supported surface is authored in the
# authoring-contract sprint (003). Empty sections below are NOT final — they show
# the manifest's shape, nothing more.
#
# This one file is the source from which the build GENERATES:
#   - lib.cathode.d.ts   — the DOM + JS type surface authors compile against
#   - css-allow-list.toml — the properties the CSS linter accepts
# and which is ASSERTED at engine build against the actually-registered quickjs-ng
# bindings and the litehtml configuration, so the author gate provably matches the
# engine and the two cannot drift.

[manifest]
version = 0            # schema version of this manifest (placeholder)

# --- DOM surface -----------------------------------------------------------
# The deliberately bounded DOM the runtime exposes: element creation/insertion/
# removal, attribute & property access, a minimal Event with bubbling + hit-testing,
# tree reads, and a document/mount root. This bound is the firewall against
# accidentally rebuilding a browser. (003) enumerates the exact members.
[dom]
# elements = []        # (003) supported element interfaces
# events   = []        # (003) Event surface + which event types bubble

# --- Scheduler -------------------------------------------------------------
# Promise (core quickjs-ng), timers, and requestAnimationFrame ticked against the
# worker's own clock.
[scheduler]
# globals = []         # (003) setTimeout / setInterval / requestAnimationFrame / ...

# --- JS environment --------------------------------------------------------
# ECMA-262 core at the pinned quickjs-ng baseline plus the globals Cathode provides
# (console, the scheduler, the game.* host API). Nothing else exists — no fetch, no
# Intl, no localStorage.
[js]
# ecma_baseline = ""   # (003) pinned ECMA level, matched to the bundler target
# globals = []         # (003) provided globals

# --- CSS -------------------------------------------------------------------
# The CSS capability declaration (013 slice 1) — the supported-property SINGLE SOURCE. SETTLED METHOD (browse-design
# re-ratified, components-css.md): INVERTED names-minus-exclusions. The supported set is litehtml's OWN authoritative
# CSS-property parse-name table (string_id.h:163-295, 115 names) MINUS 7 source-cited exclusions = 108 present. NOT a
# member-filter: a name==member / prefix reconstruction silently drops shorthands whose decomposition lives in
# litehtml's non-vendored parse() .cpp (flex-flow was one such hole; the hole-count is unknowable from headers).
# Reading the NAME table is certifiable + fails SAFE (over-include benign under accept-and-ignore). A file-derived
# completeness test asserts this set == string_id.h:163-295 minus the exclusions (bites on a litehtml name add/remove).
#
# THE 7 EXCLUSIONS (source-cited, not taste):
#   __litehtml_border_spacing_x/y (string_id.h:182,183) — engine-internal accessors (__litehtml_ prefix).
#   background-image-baseurl (166), list-style-image-baseurl (229) — url-resolution internals (member-backed -> pass a
#       member-filter; excluded by name).
#   font-variant (245), counter-reset (294), counter-increment (295) — parse names with NO computed member; litehtml
#       interns but does not compute them. The R2 member cross-check asserts these 3 stay member-less, so a future
#       litehtml member-add for any FLAGS the exclusion for reclassification.
#
# status:
#   present             = a litehtml parse name (author-settable; cascade-real lands 013 slices 3-4).
#   build_how_pending   = Axis-3 IN, NOT a litehtml parse name; DECLARED-present yet cascade-EMPTY until the build-how
#                         lands. opacity (cascade + Blend2D alpha) + letter-spacing. Any DROP is tcdent's.
#                         (gap/row-gap/column-gap were build-how-committed; tcdent descoped them from 014 — NOT spec'd.)
#
# PENDING (tcdent, exclusion-list edit only — NOT a method change): the ~14 litehtml-NONSTANDARD axis longhands
# (background-position-x/y, border-radius-x/y, per-corner border-*-radius-x/y) are IN the 115 -> present at the
# keep-literal default (108). If tcdent curates them to standard-names-only they JOIN the exclusions (-> ~94).
[css]
