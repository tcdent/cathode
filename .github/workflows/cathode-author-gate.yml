# The Cathode author-build gate in CI. Runs the self-contained Authoring/ Node gate (tsc DOM/JS + css-tree CSS +
# esbuild IIFE) on every push/PR that touches Authoring/. `npm run gate` exits non-zero on a banned authorship (a banned
# web API in a screen's .ts, an unsupported CSS property in its .css, or the standing negative screens/banned/ not being
# rejected), which fails this workflow.
#
# SCOPE: the Node author-gate ONLY. The UE C++ automation suite is not runnable here: it needs a Windows machine with a
# licensed UE install, which a stock GitHub runner does not have. Running it in CI is a separate, self-hosted-runner effort.
name: Cathode Author Gate

on:
  push:
    paths:
      - 'Cathode/Authoring/**'
      - '.github/workflows/cathode-author-gate.yml'
  pull_request:
    paths:
      - 'Cathode/Authoring/**'
      - '.github/workflows/cathode-author-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cathode/Authoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` installs the committed lockfile (typescript + esbuild + css-tree).
      - run: npm ci
      # The gate. Exit 0 = PASS; non-zero = a banned authorship -> this step fails. The standing
      # screens/banned/ negative keeps the bite live: if the gate ever stops rejecting it, the gate exits non-zero here.
      - run: npm run gate
