# 029 #29 — the Cathode author-build gate in CI (the repo's FIRST GitHub Actions workflow). Runs the self-contained
# Authoring/ Node gate (tsc DOM/JS + css-tree CSS + esbuild IIFE) on every push/PR that touches Authoring/. `npm run gate`
# EXIT-CODE-BITES: it exits non-zero on a banned authorship (a banned web API in a screen's .ts, an unsupported CSS
# property in its .css, or the standing negative screens/banned/ not being rejected) -> this CI step goes RED. NOT a
# clean-only CI.
#
# SCOPE: the Node author-gate ONLY. The UE C++ automation suite is NOT runnable here — `make test` (game/Makefile:269-272)
# assumes a RUNNING UnrealEditor reachable over MCP on a Windows box + a licensed UE install; a stock GitHub runner has
# neither. Running the UE suite in CI is a separate, self-hosted-runner effort (a follow-on), deliberately NOT bundled here.
name: Cathode Author Gate

on:
  push:
    paths:
      - 'Cathode/Authoring/**'
      - '.github/workflows/cathode-author-gate.yml'
  pull_request:
    paths:
      - 'Cathode/Authoring/**'
      - '.github/workflows/cathode-author-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cathode/Authoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` installs the committed lockfile (typescript + esbuild + css-tree); the box has no Node, so this is the
      # dev-machine/CI channel the gate was designed for.
      - run: npm ci
      # The gate. Exit 0 = PASS; non-zero = a banned authorship -> this step (and the CI) goes RED. The standing
      # screens/banned/ negative keeps the bite live: if the gate ever stops rejecting it, the gate exits non-zero here.
      - run: npm run gate
